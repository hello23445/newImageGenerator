<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Просмотр рекламы</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Стили -->
    <link rel="stylesheet" href="ad_styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="toastContainer"></div>

<div class="container">
    <div class="video-wrapper">
        <iframe id="adIframe" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <div id="adText" class="ad-text"></div>

    <div class="buttons">
        <button id="commentBtn" class="btn secondary" style="display:none;">
            <i class="fa-regular fa-comment"></i>
            Комментарий
        </button>

        <button id="complainBtn" class="btn danger">
            <i class="fa-solid fa-triangle-exclamation"></i>
            Пожаловаться
        </button>

        <button id="continueBtn" class="btn primary" disabled>
            Продолжить (…)
        </button>
    </div>

    <div class="security-note">
        <i class="fa-solid fa-shield-check"></i>
        <i class="fa-solid fa-shield-halved"></i>Эта реклама и её ссылки проверены средством CrN Ads’ Security<i class="fa-solid fa-shield-halved"></i>
    </div>
</div>

<!-- Жалоба -->
<div id="complainModal" class="modal">
    <div class="modal-content">
        <h3>Жалоба на рекламу</h3>

        <select id="complainSelect">
            <option value="" disabled selected>Выберите причину</option>
            <option value="Спам">Спам</option>
            <option value="Обман">Обман</option>
            <option value="Неприемлемый контент">Неприемлемый контент</option>
            <option value="Другое">Другое</option>
        </select>

        <input id="complainInput" type="text" placeholder="Опишите причину" style="display:none;">

        <div class="modal-buttons">
            <button id="cancelComplain" class="btn secondary">Отмена</button>
            <button id="sendComplain" class="btn primary">Отправить</button>
        </div>
    </div>
</div>

<!-- Комментарий -->
<div id="commentModal" class="modal">
    <div class="modal-content">
        <h3>Ваш комментарий</h3>

        <input id="commentInput" type="text" placeholder="Введите текст...">
        <p class="hint"><i class="fa-solid fa-lock" style="font-size: 10px;"></i> Комментарий анонимный</p>

        <div class="modal-buttons">
            <button id="cancelComment" class="btn secondary">Отмена</button>
            <button id="sendComment" class="btn primary">Отправить</button>
        </div>
    </div>
</div>

<!-- Загрузка -->
<div id="loadingModal" class="modal">
    <div class="modal-content loading-content">
        <div class="loader"></div>
        <p style="margin-top: 15px; color: #94a3b8; font-size: 14px;">Загрузка...</p>
    </div>
</div>

<script type="module" src="security.js"></script>
<script src="ad_script.js"></script>
<script>
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.SettingsButton.hide();
}
</script>
</body>
</html>
